version: 1
replace_defaults: true
transcripts_dir: .llm-council/runs

defaults:
  mode: quick
  synthesize: false
  origin_policy: any
  max_concurrency: 4
  transparent: false
  max_deliberation_rounds: 2

# Native CLI participants intentionally omit model by default so paid/max CLI
# accounts can use their own current default model. Add model only when you want
# exact routing.
participants:
  claude:
    type: cli
    family: claude
    origin: US / Anthropic
    command: claude
    args:
    - -p
    - --permission-mode
    - default
    - --tools
    - Read,Grep,Glob,LS
    - --no-session-persistence
    model:
    timeout: 240
    max_prompt_chars: 120000
    stdin_prompt: true
    env_passthrough:
    - ANTHROPIC_API_KEY

  codex:
    type: cli
    family: codex
    origin: US / OpenAI
    command: codex
    args:
    - exec
    - --sandbox
    - read-only
    - --ephemeral
    - --cd
    - "{cwd}"
    - "-"
    model:
    timeout: 240
    stdin_prompt: true
    env_passthrough:
    - OPENAI_API_KEY

  gemini:
    type: cli
    family: gemini
    origin: US / Google
    command: gemini
    args:
    - --approval-mode
    - plan
    model:
    timeout: 240
    stdin_prompt: true
    env_passthrough:
    - GEMINI_API_KEY
    - GOOGLE_API_KEY

  # Antigravity is the default Gemini-family compatibility route. --mode plan
  # (agy 1.1.0+) disables its file-write tool; --sandbox restricts shell
  # commands. agy ignores stdin since 1.1.1, so the prompt is passed as the
  # --print argument. Keep --dangerously-skip-permissions out of this
  # participant.
  antigravity:
    type: cli
    family: antigravity
    origin: US / Google
    command: agy
    args:
    - --print
    - "{prompt}"
    - --sandbox
    - --mode
    - plan
    model:
    timeout: 240
    max_prompt_chars: 120000
    stdin_prompt: false
    env_passthrough:
    - GEMINI_API_KEY
    - GOOGLE_API_KEY
    - ANTIGRAVITY_API_KEY

  deepseek_v4_pro:
    type: openrouter
    family: deepseek
    origin: China / DeepSeek
    model: deepseek/deepseek-v4-pro
    input_per_million: 0.435
    output_per_million: 0.87
    api_key_env: OPENROUTER_API_KEY
    timeout: 180

  qwen_coder_plus:
    type: openrouter
    family: qwen
    origin: China / Alibaba Qwen
    model: qwen/qwen3-coder-plus
    input_per_million: 0.65
    output_per_million: 3.25
    api_key_env: OPENROUTER_API_KEY
    timeout: 180

modes:
  quick:
    strategy: other_cli_peers
    include_current: true
    description: Ask available Claude/Codex and Gemini-family participants.

  peer-only:
    strategy: other_cli_peers
    include_current: false
    description: Ask only the other native CLIs, excluding the current host.

  plan:
    strategy: other_cli_peers
    include_current: true
    add:
    - deepseek_v4_pro
    description: Native CLI participants plus DeepSeek V4 Pro for independent planning.

  review:
    strategy: other_cli_peers
    include_current: true
    add:
    - qwen_coder_plus
    description: Native CLI participants plus Qwen Coder Plus for code review.
