version: 1
replace_defaults: true
transcripts_dir: .llm-council/runs

defaults:
  mode: quick
  synthesize: false
  origin_policy: any
  max_concurrency: 4
  transparent: false
  max_deliberation_rounds: 2
  mcp_request_timeout_seconds: 240

# Native CLI participants intentionally omit model by default so paid/max CLI
# accounts can use their own current default model. Add model only when you want
# exact routing.
participants:
  claude:
    type: cli
    family: claude
    origin: US / Anthropic
    command: claude
    args:
    - -p
    - --permission-mode
    - manual
    - --tools
    - Read,Grep,Glob,LS
    - --no-session-persistence
    - --strict-mcp-config
    - --exclude-dynamic-system-prompt-sections
    model:
    timeout: 240
    max_prompt_chars: 120000
    stdin_prompt: true
    env_passthrough:
    - ANTHROPIC_API_KEY

  # `-c mcp_servers={}` keeps a council-spawned codex from booting ANY MCP
  # servers from the operator's global codex config — including llm-council
  # itself, which would recurse (a council must never start another council).
  codex:
    type: cli
    family: codex
    origin: US / OpenAI
    command: codex
    args:
    - exec
    - --sandbox
    - read-only
    - --ephemeral
    - --skip-git-repo-check
    - -c
    - mcp_servers={}
    - --cd
    - "{cwd}"
    - "-"
    model:
    timeout: 240
    stdin_prompt: true
    env_passthrough:
    - OPENAI_API_KEY

  # Antigravity is the Gemini-family route (Google retired the standalone
  # `gemini` CLI for individual accounts in June 2026). --mode plan
  # (agy 1.1.0+) disables its file-write tool; --sandbox restricts shell
  # commands; --new-project isolates each run from agy's global conversation
  # store. agy ignores stdin since 1.1.1, so the prompt is passed as the
  # --print argument. Keep --dangerously-skip-permissions out of this
  # participant.
  antigravity:
    type: cli
    family: antigravity
    origin: US / Google
    command: agy
    args:
    - --print
    - "{prompt}"
    - --sandbox
    - --mode
    - plan
    - --new-project
    model:
    timeout: 240
    max_prompt_chars: 120000
    stdin_prompt: false
    env_passthrough:
    - GEMINI_API_KEY
    - GOOGLE_API_KEY
    - ANTIGRAVITY_API_KEY

  # Hosted OpenRouter peers are DEFINED here as opt-in material but no mode
  # below seats them by default — the default council is local-CLI only.
  # Seat one per-run (`--include deepseek_v4_pro`) or per-mode via `add`.
  deepseek_v4_pro:
    type: openrouter
    family: deepseek
    origin: China / DeepSeek
    model: deepseek/deepseek-v4-pro
    input_per_million: 0.435
    output_per_million: 0.87
    api_key_env: OPENROUTER_API_KEY
    timeout: 180

  qwen_coder_plus:
    type: openrouter
    family: qwen
    origin: China / Alibaba Qwen
    model: qwen/qwen3-coder-plus
    input_per_million: 0.65
    output_per_million: 3.25
    api_key_env: OPENROUTER_API_KEY
    timeout: 180

modes:
  quick:
    strategy: other_cli_peers
    include_current: true
    description: Ask available Claude/Codex and Gemini-family participants.

  peer-only:
    strategy: other_cli_peers
    include_current: false
    description: Ask only the other native CLIs, excluding the current host.

  plan:
    strategy: other_cli_peers
    include_current: true
    description: Native CLI participants for independent planning.

  # To seat a hosted peer in a mode, add it explicitly, e.g.:
  #   review:
  #     add: [qwen_coder_plus]
  review:
    strategy: other_cli_peers
    include_current: true
    description: Native CLI participants reviewing the change.
    # Enable only when okf-rs is installed; inspect metadata.okf_context coverage.
    # okf_context: true

  review-with-tools:
    strategy: other_cli_peers
    include_current: true
    experimental: true
    description: Verify review claims using native read-only repository tools.
    # Mode settings are separate; this does not inherit review's OKF toggle.
    # okf_context: true
